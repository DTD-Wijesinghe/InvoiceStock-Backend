services:
  - type: web
    name: invoicestock-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: "InvoiceStock"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "small-files"
      - key: PAYHERE_SANDBOX
        value: "true"
